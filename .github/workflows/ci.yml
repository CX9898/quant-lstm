name: CI

on:
  push:
  pull_request:

jobs:
  cpu-package:
    name: CPU ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Debug
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: Release
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nlohmann-json3-dev python3-jsonschema
      - name: 验证 CPU-only 构建、测试和安装包
        run: |
          tools/run_cpu_only_package_check.sh \
            "${{ runner.temp }}/quant-lstm-${{ matrix.compiler }}-${{ matrix.build_type }}" \
            "${{ matrix.build_type }}"
